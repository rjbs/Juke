<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juke</title>
<link rel="stylesheet" href="juke.css">
</head>
<body>
<header>
  <h1>JUKE</h1>
  <nav>
    <a href="#albums" data-tab="albums">Albums</a>
    <a href="#tracks" data-tab="tracks">Tracks</a>
    <a href="#playlists" data-tab="playlists">Playlists</a>
  </nav>
  <span class="status" id="status"></span>
</header>
<main id="main"></main>
<footer>
  <button id="prev" title="Previous">⏮</button>
  <button id="next" title="Next">⏭</button>
  <div class="now"><div class="what" id="now-what">Nothing playing</div><div class="where" id="now-where"></div></div>
  <audio id="audio" controls preload="auto"></audio>
</footer>
<script src="juke.js"></script>
<script src="review.js"></script>
</body>
</html>

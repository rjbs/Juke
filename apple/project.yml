# The Juke apps for iOS and macOS, generated by XcodeGen:
#
#   cd apple && xcodegen
#
# Juke.xcodeproj is generated and not committed; this file is the
# source.  Nearly all the code is in the JukeKit package; the app target
# is an entry point and its settings.
name: Juke
options:
  bundleIdPrefix: systems.semiotic
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  JukeKit:
    path: JukeKit
targets:
  Juke:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: JukeKit
        product: JukeUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Juke
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        LSApplicationCategoryType: public.app-category.music
        # The server speaks plain HTTP on the tailnet for now.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.semiotic.juke
        # Ricardo Signes (Personal Team), not Fastmail's.
        DEVELOPMENT_TEAM: RF24M9W2UV
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

# The Juke apps for iOS and macOS, generated by XcodeGen:
#
#   cd apple && xcodegen
#
# Juke.xcodeproj is generated and not committed; this file is the
# source.  Nearly all the code is in the JukeKit package; the app target
# is an entry point and its settings.
name: Juke
options:
  bundleIdPrefix: systems.semiotic
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  JukeKit:
    path: JukeKit
targets:
  Juke:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: JukeKit
        product: JukeUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Juke
        # The release script sets the build number; see bin/release.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Juke uses no encryption beyond what the system provides, which
        # App Store Connect would otherwise ask about on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # An iPad app that allows multitasking must allow every orientation.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.music
        # The server speaks HTTPS on the tailnet.  Plain HTTP is allowed only
        # to the local network: the scratch server and the tests use
        # localhost.  -- claude, 2026-11-01
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.semiotic.juke
        # Ricardo Signes (Personal Team), not Fastmail's.
        DEVELOPMENT_TEAM: RF24M9W2UV
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  # Drives the iOS app in the simulator; see bin/ui-test.
  JukeUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [UITests]
    dependencies:
      - target: Juke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.semiotic.juke.uitests
        DEVELOPMENT_TEAM: RF24M9W2UV
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Juke
schemes:
  Juke:
    build:
      targets:
        Juke: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [JukeUITests]
